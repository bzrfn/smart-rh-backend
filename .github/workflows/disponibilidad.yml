name: Disponibilidad de API
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disponibilidad-publica
  cancel-in-progress: false
jobs:
  disponibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Comprobar API sin escrituras
        run: python3 ops/devops/profesional/health.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disponibilidad-${{ github.run_id }}-${{ github.run_attempt }}
          path: informes-ci/profesional/disponibilidad.json
          retention-days: 14
