name: Disponibilidad de API
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disponibilidad-publica
  cancel-in-progress: false
jobs:
  disponibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Comprobar API sin escrituras
        run: python3 ops/devops/profesional/health.py
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: disponibilidad-${{ github.run_id }}-${{ github.run_attempt }}
          path: informes-ci/profesional/disponibilidad.json
          retention-days: 14
