name: Controles DevOps
on:
  workflow_call:
permissions:
  contents: read
jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Verificar controles
        run: python3 -m unittest discover -s ops/devops/profesional -p 'test_*.py'
      - name: Escanear historial sin exponer secretos
        run: python3 ops/devops/profesional/secrets.py
      - name: Auditar dependencias y generar SBOM
        if: success() || failure()
        run: python3 ops/devops/profesional/quality.py
      - name: Vincular evidencia con revision
        run: python3 ops/devops/profesional/evidence.py
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: devops-${{ github.sha }}-${{ github.run_attempt }}
          path: informes-ci/profesional/
          if-no-files-found: error
          retention-days: 14
